- name: Configure Apache Web Server
  hosts: web
  become: yes
  tasks:
    - name: Instalar Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Subir arquivo de index.html
      copy:
        dest: /var/www/html/index.html
        content: "<h1>Aplicação implantada com Terraform + Ansible!</h1>"

    - name: Iniciar e habilitar Apache
      service:
        name: apache2
        state: started
        enabled: yes
